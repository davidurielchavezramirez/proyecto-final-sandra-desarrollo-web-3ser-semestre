<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="NEW ACCOUNT P2.css">
</head>
<body>

  <!-- Texto amarillo vertical -->
  <div class="vertical-text">
    <span>UNIVERSAL</span>
    <span>GAMES</span>
  </div>

  <!-- Caja blanca -->
  <div class="container">

    <h2>WELCOME TO COSMONAUT!</h2>

    <label>Adress:</label>
    <input type="text" id="direccion" placeholder="E.X: JOSE VASCONCELOS #123">

    <label>Credit/debit card numbers:</label>
    <input type="text" id="tarjeta" placeholder="E.X: 1234 5678 9012 3456">

    <label>CVV:</label>
    <input type="text" id="cvv" placeholder="E.X: 123">
    
    <label>Date of birth:</label>
    <input type="date" id="fechaNacimiento" placeholder="E.X: 01/01/2000">
    

  <p class="signup">
  <!-- hacer un boton qur guarde los datos -->
   <!-- listo-->
<button id="btnPayment">Save & Sign In</button>


    <!-- Aquí aparece el mensaje -->
    <p id="mensaje"></p>
  </div>
    <script src="NEW ACCOUNT P2.js"></script>
</body>
</html>
