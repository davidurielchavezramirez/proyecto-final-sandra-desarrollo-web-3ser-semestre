<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="NEW ACCOUNT.css">
</head>
<body>

  <!-- Texto amarillo vertical -->
  <div class="vertical-text">
    <span>UNIVERSAL</span>
    <span>GAMES</span>
  </div>

  <!-- Caja blanca -->
  <div class="container">

    <h2>WELCOME TO COSMONAUT!</h2>

    <label>Email Address:</label>
    <input type="email" id="correo" placeholder="E.X: EXAMPLE@OUTLOOK.COM">

    <label>Password:</label>
    <input type="password" id="contrasena" placeholder="E.X: PASSWORD">

    <label>Phone:</label>
    <input type="tel" id="telefono" placeholder="E.X: +1234567890">


    <!-- Aquí aparece el mensaje -->
    <p id="mensaje"></p>
<!-- hacer un boton que guarde los datos -->


<button id="btnRegister">Create Account</button>


  </div>
    <script src="NEW ACCOUNT.js"></script>
</body>
</html>
